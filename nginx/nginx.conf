# Reverse proxy in front of the app: the visitor's IP, an access log with
# timings and the Cloudflare ray ID, and the preview API rate limit.
worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format og '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time $upstream_response_time $http_cf_ray $upstream_http_x_oginstagram_embed';
    access_log /dev/stdout og;
    server_tokens off;

    # Eight previews per Cloudflare clearance, then one every 7.5 seconds.
    limit_req_zone $cookie_cf_clearance zone=preview:10m rate=8r/m;
    limit_req_status 429;

    upstream app {
        # One `server` line for the live blue/green slot; reloaded on switch.
        include /etc/nginx/runtime/app-upstream.conf;
        keepalive 16;
    }

    server {
        listen 8080;
        client_max_body_size 16k;

        # Only the Cloudflare Tunnel connector may supply the visitor address.
        set_real_ip_from 172.30.0.3;
        real_ip_header CF-Connecting-IP;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        # Unbuffered, so a large response never spills into the 16 MB /tmp tmpfs.
        proxy_buffering off;

        location / {
            proxy_pass http://app;
        }

        location = /api/embed {
            limit_req zone=preview burst=7 nodelay;
            proxy_pass http://app;
        }
    }

    # Container health check only: loopback listener, no realip.
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /health {
            return 200;
        }
    }
}
