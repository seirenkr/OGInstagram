<!doctype html>
<html lang="{{LANG}}" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{BRAND}}</title>
  <meta name="description" content="{{T_TAGLINE}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{BRAND}}">
  <meta property="og:title" content="{{BRAND}}">
  <meta property="og:description" content="{{T_TAGLINE}}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{BRAND}}">
  <meta name="twitter:description" content="{{T_TAGLINE}}">
  <meta name="og-head-links-placeholder">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/PPMori-Regular.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/PPMori-Semibold.woff2">
  <link rel="icon" href="/favicon-64.png" sizes="64x64" type="image/png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css">
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script nonce="__OG_CSP_NONCE__">
    (function () {
      var saved = localStorage.getItem("theme");
      var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.mode = dark ? "dark" : "light";
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script id="app-data" type="application/json">{{APP_JSON}}</script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
