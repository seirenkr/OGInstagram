name: oginstagram

services:
  app:
    image: ${OG_IMAGE:-oginstagram:local}
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      PORT: "8080"
      DATA_DIR: /data
      ASSETS_DIR: /app/web
      GOMEMLIMIT: 256MiB
      GOMAXPROCS: "1"
      # Exact cloudflared address below, never the entire subnet.
      TRUSTED_PROXIES: 172.30.0.3
    user: "65532:65532"
    restart: unless-stopped
    init: true
    read_only: true
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - ./data:/data
    networks:
      origin:
        ipv4_address: 172.30.0.2
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c}
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel_token]
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    mem_limit: 128m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    secrets:
      - tunnel_token
    depends_on:
      app:
        condition: service_healthy
    networks:
      origin:
        ipv4_address: 172.30.0.3
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  origin:
    ipam:
      config:
        - subnet: 172.30.0.0/24

secrets:
  tunnel_token:
    file: ./secrets/tunnel-token
