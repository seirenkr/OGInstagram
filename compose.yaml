name: oginstagram

# Blue/green app slots: tools/deploy.sh starts the idle slot, waits for it to
# be healthy, points nginx at it, then stops the old slot (graceful drain).
x-app: &app
  image: ${OG_IMAGE:-oginstagram:local}
  env_file:
    - ${APP_ENV_FILE:-.env}
  environment:
    PORT: "8080"
    DATA_DIR: /data
    ASSETS_DIR: /app/web
    # Leave room inside the container for one verification browser.
    GOMEMLIMIT: 128MiB
    GOMAXPROCS: "1"
    # Exact nginx address below, never the entire subnet.
    TRUSTED_PROXIES: 172.30.0.4
  user: "65532:65532"
  restart: unless-stopped
  init: true
  read_only: true
  mem_limit: 768m
  cpus: 1
  # Chromium verification briefly needs more than 128 threads, even one at a time.
  pids_limit: 256
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 40s
  # Image check plus start_interval, so a new slot reports healthy within seconds.
  healthcheck:
    test: [CMD, /app/server, --healthcheck]
    interval: 30s
    timeout: 5s
    start_period: 10s
    start_interval: 1s
    retries: 3
  tmpfs:
    - /tmp:size=128m,mode=1777
  volumes:
    - ./data:/data
  # journald keeps a slot's logs after deploys recreate its container.
  logging:
    driver: journald

services:
  app_blue:
    <<: *app
    networks:
      origin:
        ipv4_address: 172.30.0.2

  app_green:
    <<: *app
    networks:
      origin:
        ipv4_address: 172.30.0.5

  # Access log, visitor IP (realip), and preview rate limit.
  proxy:
    image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:b9241c6e7b8e9a862f129d8d4199ab64b10390949a78bdd5603379b32c844083
    restart: unless-stopped
    read_only: true
    mem_limit: 64m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # app-upstream.conf names the live slot; written by tools/deploy.sh.
      - ./nginx/runtime:/etc/nginx/runtime:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/health]
      interval: 30s
      timeout: 5s
      start_period: 5s
    networks:
      origin:
        ipv4_address: 172.30.0.4
    logging:
      driver: journald

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c}
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel_token]
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    mem_limit: 128m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    secrets:
      - tunnel_token
    depends_on:
      proxy:
        condition: service_healthy
    networks:
      origin:
        ipv4_address: 172.30.0.3
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  origin:
    ipam:
      config:
        - subnet: 172.30.0.0/24

secrets:
  tunnel_token:
    file: ./secrets/tunnel-token
