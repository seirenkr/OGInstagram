name: oginstagram

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  # journald keeps a slot's logs after deploys recreate its container.
  logging:
    driver: journald

# Blue/green app slots: tools/deploy.sh starts the idle slot, waits for it to
# be healthy, points nginx at it, then stops the old slot (graceful drain).
x-app: &app
  <<: *hardened
  image: ${OG_IMAGE:-oginstagram:local}
  env_file: .env
  environment:
    DATA_DIR: /data
    ASSETS_DIR: /app/web
    # Leave room inside the container for one verification browser.
    GOMEMLIMIT: 128MiB
    # Exact nginx address below, never the entire subnet.
    TRUSTED_PROXIES: 172.30.0.4
    # Without the egress, Instagram requests use the DC proxy.
    EGRESS_SOCKET: /run/egress/egress.sock
  user: "65532:65532"
  init: true
  mem_limit: 768m
  # Chromium verification briefly needs more than 128 threads, even one at a time.
  pids_limit: 256
  stop_grace_period: 40s
  # start_interval lets a new slot report healthy within seconds.
  healthcheck:
    test: [CMD, /app/server, --healthcheck]
    interval: 30s
    timeout: 5s
    start_period: 10s
    start_interval: 1s
    retries: 3
  tmpfs:
    - /tmp:size=128m,mode=1777
  volumes:
    - ./data:/data
    - ./run/egress:/run/egress:ro

services:
  app_blue:
    <<: *app
    networks:
      origin:
        ipv4_address: 172.30.0.2

  app_green:
    <<: *app
    networks:
      origin:
        ipv4_address: 172.30.0.5

  # IPv6 egress: host network for the addresses tools/ipv6-pool.sh assigns;
  # serves the app only over the socket in run/egress. tools/deploy.sh starts it.
  egress:
    <<: *hardened
    image: ${OG_IMAGE:-oginstagram:local}
    command: [--egress]
    environment:
      EGRESS_SOCKET: /run/egress/egress.sock
    network_mode: host
    user: "65532:65532"
    mem_limit: 64m
    pids_limit: 64
    volumes:
      - ./run/egress:/run/egress
      - /etc/oginstagram:/etc/oginstagram:ro

  # Access log, visitor IP (realip), and preview rate limit.
  proxy:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:1.30-alpine@sha256:15c994d10d6d78658721c3bcafff14cb281fba2a4bdf9d5ba92c416a472516e3
    mem_limit: 64m
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # app-upstream.conf names the live slot; written by tools/deploy.sh.
      - ./nginx/runtime:/etc/nginx/runtime:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/health]
      interval: 30s
      timeout: 5s
      start_period: 5s
    networks:
      origin:
        ipv4_address: 172.30.0.4

  cloudflared:
    <<: *hardened
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39}
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel_token]
    user: "65532:65532"
    mem_limit: 128m
    pids_limit: 64
    secrets:
      - tunnel_token
    depends_on:
      proxy:
        condition: service_healthy
    networks:
      origin:
        ipv4_address: 172.30.0.3
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  origin:
    ipam:
      config:
        - subnet: 172.30.0.0/24

secrets:
  tunnel_token:
    file: ./secrets/tunnel-token
